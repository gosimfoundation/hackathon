# scripts/agent-observer.json decides which build of the participant platform
# /survey26/platform/ serves. A branch cut before a pin bump can carry the old revision
# back in on merge, silently rolling the live site back. This check catches that.
name: Agent Observer pin

on:
  pull_request:
    paths:
      - 'scripts/agent-observer.json'

jobs:
  direction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The pinned revision must not move backwards
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.base_ref }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          new=$(jq -r .revision scripts/agent-observer.json)
          old=$(gh api "repos/${REPO}/contents/scripts/agent-observer.json?ref=${BASE_REF}" \
                  --jq .content | base64 -d | jq -r .revision)
          echo "base ${BASE_REF}: ${old}"
          echo "this PR:        ${new}"
          if [ "$new" = "$old" ]; then
            echo "Pin unchanged."
            exit 0
          fi
          platform=$(jq -r .repository scripts/agent-observer.json)
          git clone --quiet --filter=blob:none --no-checkout "$platform" platform-repo
          cd platform-repo
          git fetch --quiet origin "$old" "$new"
          if git merge-base --is-ancestor "$new" "$old"; then
            echo "::error file=scripts/agent-observer.json::This PR moves the platform pin BACKWARDS (${old} -> ${new}). ${new} is an ancestor of ${old}, so merging would serve an older build of /survey26/platform/. If the rollback is deliberate, say so in the PR description and an admin can merge past this check; otherwise rebase on main and keep the newer revision."
            exit 1
          fi
          echo "Pin moves forward."
